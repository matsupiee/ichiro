name: Deploy Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Deploy environment
        type: choice
        options: [stg, prod]
        default: stg
        required: true
      commit:
        description: Full commit SHA (prod must use the SHA verified on stg)
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-${{ inputs.stage || 'stg' }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage || 'stg' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Require a successful staging deployment for production
        if: inputs.stage == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.commit }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Specify a full commit SHA'; exit 1; }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs" \
            -f head_sha="$TARGET_SHA" -f event=push -f status=success \
            --jq '.workflow_runs | any(.head_branch == "main")' | grep -qx true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run test
      - name: Deploy
        env:
          CI: "true"
          DEPLOY_STAGE: ${{ inputs.stage || 'stg' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: bun run "deploy:$DEPLOY_STAGE" --yes
