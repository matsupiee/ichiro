appId: com.anonymous.ichiro
---
- tapOn:
    id: "reset-code"
- inputText: "${OTP}"
- tapOn:
    id: "password-input"
- inputText: "reset-native-new-password"
- tapOn: "パスワードを表示"
- assertVisible: "reset-native-new-password"
- tapOn: "パスワードを隠す"
- pressKey: Enter
- tapOn:
    text: "今はしない"
    optional: true
- extendedWaitUntil:
    visible: "ログイン画面へ"
    timeout: 15000
- takeScreenshot: /tmp/ichiro-password-reset-complete
- tapOn: "ログイン画面へ"
- assertVisible: "password-reset@ichiro.example"
- tapOn:
    id: "password-input"
- inputText: "reset-demo-password"
- pressKey: Enter
- extendedWaitUntil:
    visible: "メールアドレスまたはパスワードが違います"
    timeout: 15000
- tapOn:
    id: "password-input"
- eraseText
- inputText: "reset-native-new-password"
- pressKey: Enter
- tapOn:
    text: "今はしない"
    optional: true
- extendedWaitUntil:
    visible: "コミットメントを作成"
    timeout: 15000
- takeScreenshot: /tmp/ichiro-password-reset-signed-in
