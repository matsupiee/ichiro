appId: com.anonymous.ichiro
---
- launchApp
- tapOn:
    text: "今はしない"
    optional: true
- openLink: ichiro://sign-in
- extendedWaitUntil:
    visible: "you@example.com"
    timeout: 15000
- tapOn: "you@example.com"
- inputText: "${EMAIL}"
- pressKey: Enter
- inputText: "withdrawal-demo-password"
- pressKey: Enter
- tapOn:
    text: "今はしない"
    optional: true
- extendedWaitUntil:
    visible: "アカウント"
    timeout: 15000
