appId: com.anonymous.ichiro
---
- launchApp
- openLink: "ichiro://sign-up"
- tapOn:
    text: "開く|Open"
    optional: true
- extendedWaitUntil:
    visible: "パスワードを表示"
    timeout: 120000
- assertVisible: "パスワードを表示"
- tapOn: "ラッシー"
- inputText: "Visibility Test"
- pressKey: Enter
- inputText: "visibility@ichiro.example"
- pressKey: Enter
- inputText: "visible-password"
- tapOn: "パスワードを表示"
- assertVisible: "visible-password"
- inputText: "-continued"
- assertVisible: "visible-password-continued"
- tapOn: "パスワードを隠す"
- tapOn: "パスワードを表示"
- assertVisible: "visible-password-continued"
- takeScreenshot: /tmp/ichiro-password-visibility
- tapOn: "パスワードを隠す"
- tapOn: "アカウントをお持ちの方はこちら"
- assertVisible: "パスワードを表示"
