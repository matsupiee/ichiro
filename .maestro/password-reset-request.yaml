appId: com.anonymous.ichiro
---
- launchApp
- openLink: "ichiro://sign-in"
- tapOn:
    text: "開く|Open"
    optional: true
- extendedWaitUntil:
    visible: "パスワードを表示"
    timeout: 120000
- tapOn: "you@example.com"
- inputText: "password-reset@ichiro.example"
- pressKey: Enter
- inputText: "reset-demo-password"
- tapOn: "パスワードを表示"
- assertVisible: "reset-demo-password"
- tapOn: "パスワードを隠す"
- tapOn: "パスワードを忘れた方はこちら"
- tapOn:
    text: "今はしない"
    optional: true
- assertVisible: "password-reset@ichiro.example"
- tapOn: "認証コードを送信する"
- extendedWaitUntil:
    visible: "新しいパスワード"
    timeout: 15000
- assertVisible:
    id: "reset-code"
- takeScreenshot: /tmp/ichiro-password-reset-request
