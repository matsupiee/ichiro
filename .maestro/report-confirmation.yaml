# iPhone 17 / iOS 26.4。ログイン済みのテスト用アカウントで実行する。
# カード内の丸は親とアクセシビリティ要素がまとまるため、先頭行の丸を座標で押す。
appId: com.anonymous.ichiro
---
- stopApp
- launchApp
- openLink: ichiro://commitments/new
- tapOn:
    text: "開く"
    optional: true
- extendedWaitUntil:
    visible: "コミットメント作成"
    timeout: 20000
- assertNotVisible: "目標"
- tapOn: "コミット内容 毎日30分広東語を練習する"
- inputText: "Report confirmation test"
- hideKeyboard
- scrollUntilVisible:
    element: "宣言する"
    direction: DOWN
- tapOn: "宣言する"
- extendedWaitUntil:
    visible: "宣言したワン！"
    timeout: 10000
- tapOn: "ホームに戻る"
- tapOn:
    point: "87%,28%"
- assertVisible: "達成済みにしますか？？"
- assertVisible: "「Report confirmation test」の今日の達成を報告します。"
- takeScreenshot: report-confirmation-preferred
- assertNotVisible: "つづける"
- tapOn: "キャンセル"
- assertNotVisible: "達成済みにしますか？？"
- assertVisible: "コミットメントを作成"
- tapOn:
    point: "87%,28%"
- assertVisible: "達成済みにしますか？？"
- tapOn: "達成済みにする"
- extendedWaitUntil:
    visible: "つづける"
    timeout: 10000
- tapOn: "つづける"
- tapOn:
    text: ".*Report confirmation test.*"
    index: 0
- assertVisible: "今日は報告ずみ.*"
- assertNotVisible: "今日の達成を報告する"
